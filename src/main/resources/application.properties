spring.application.name=demo

# H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# RabbitMQ 
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# SMTP MailHog 
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Config applicative
app.mq.exchange=auth.events
app.mq.rk.userRegistered=auth.user-registered
app.mq.rk.emailVerified=auth.email-verified
app.mq.queue.userRegistered=notification.user-registered
app.token.expiry-minutes=30
app.token.base-url=http://localhost:8080

# Notification
app.mail.from=noreply@auth-demo.local
app.mail.auth-base-url=${APP_MAIL_AUTH_BASE_URL:http://localhost:8080}


# Analytics
app.mq.queue.emailVerified=analytics.email-verified
app.notification.simulate-error=false

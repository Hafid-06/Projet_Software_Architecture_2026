version: "3.9"
services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  app1:
    build: .
    container_name: spring-app-1
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_MAIL_HOST=mailhog
      - APP_MAIL_AUTH_BASE_URL=http://localhost
      - SERVER_PORT=8080
    depends_on:
      - rabbitmq
      - mailhog
    volumes:
      - h2-data-1:/data

  app2:
    build: .
    container_name: spring-app-2
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_MAIL_HOST=mailhog
      - APP_MAIL_AUTH_BASE_URL=http://localhost
      - SERVER_PORT=8080
    depends_on:
      - rabbitmq
      - mailhog
    volumes:
      - h2-data-2:/data

  service-a:
    build: ./service-a
    container_name: service-a

  service-b:
    build: ./service-b
    container_name: service-b

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - service-a
      - service-b

volumes:
  h2-data-1:
  h2-data-2:
